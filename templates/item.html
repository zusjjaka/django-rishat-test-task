<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница Товара</title>
    <style>
        body {
            background-color: #1a1f24;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: white;
            width: 100vw;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }
        h1 {
            margin-top: 50px;
            margin-bottom: 20px;
            width: auto;
            text-align: center;
        }
        p {
            width: 450px;
            font-size: 110%;
            text-align: left;
            white-space: pre-line;
        }
        button {
            height: 40px;
            width: 120px;
            background-color: #1051b5;
            color: #ffffff;
            border: none;
            border-radius: 7px;
            margin-top: 35px;
            margin-bottom: 50px;
            font-size: large;
            cursor: pointer;
        }
        input {
            margin: auto;
        }
        button:hover {
            background-color: #104ba2;
        }
        button:active {
            background-color: #0b3c84;
        }
    </style>
</head>
<body>
    {% if item_list %}
    <form method="post">
        {% csrf_token %}
        {% for item in item_list %}
        <h1>({{ item.id }}) {{ item.name }} | {{ item.price }}</h1>
        <p id="description">{{ item.description }}</p>
        <input class="item" type="number" min="0" name="quantities" placeholder="Количество" value="0">
        <input class="id" type="hidden" name="ids" value="{{ item.id }}">
        {% endfor %}
        <br><br>
        <button id="buy_all_btn">Купить</button>
        {% else %}
        <h1>{{ item.name }} | {{ item.price }}</h1>
        <p id="description">{{ item.description }}</p>
        <input type="hidden">
        <button id="buy_btn">Купить</button>
        {% endif %}
    </form>
</body>
<script src="https://js.stripe.com/v3"></script>
<script>
    if (window.location.href.endsWith('?success=true')) alert('Спасибо за покупку!');

    const stripe = Stripe("{{ stripe_pub_key }}");

    const btn = document.body.querySelector("#buy_btn");
    btn.addEventListener("click", () => {
        fetch('/buy/{{ item.id }}/')
        .then((response) => {
            return response.json();
        })
        .then((data) => {
            stripe.redirectToCheckout({sessionId: data.session_id})
        })
    })

    const description = document.querySelector("#description");
    description.textContent = description.textContent.replaceAll("<br>", "\n")
</script>
<script>
document.querySelector("form").addEventListener("submit", (event) => {
    event.preventDefault();

    const formData = new FormData(event.target);

    fetch("/buy/", {
        method: "POST",
        body: formData,
        headers: {
            "X-CSRFToken": "{{ csrf_token }}"
        }
    })
    .then((response) => {
        return response.json();
    })
    .then((data) => {
        stripe.redirectToCheckout({sessionId: data.session_id});
    })
});
</script>
</html>
